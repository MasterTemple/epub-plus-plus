<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EPUB++ demo</title>
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font: 14px system-ui, sans-serif; height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 280px 1fr; }
	header { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
	aside { overflow: auto; border-right: 1px solid #ccc; padding: 8px; }
	aside a { display: block; padding: 2px 0; color: inherit; text-decoration: none; cursor: pointer; }
	aside a:hover { text-decoration: underline; }
	#reader { min-height: 0; }
	#info { font: 12px monospace; max-width: 50ch; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
	.res { cursor: pointer; padding: 4px 0; border-bottom: 1px solid #eee; font-size: 12px; }
	.res b { background: #fd0; }
</style>
</head>
<body>
<header>
	<select id="file"></select>
	<select id="theme"><option>auto</option><option>light</option><option>dark</option><option>sepia</option><option>publisher</option></select>
	<label>size <input id="size" type="number" value="18" style="width:4em" /></label>
	<label>line <input id="lh" type="number" step="0.1" placeholder="pub" style="width:4em" /></label>
	<label>width <input id="width" type="number" value="42" style="width:4em" /><select id="unit"><option>em</option><option>ch</option><option>px</option><option>%</option></select></label>
	<label>font <input id="font" placeholder="publisher" style="width:8em" /></label>
	<button id="hl">Highlight selection</button>
	<input id="q" placeholder="search" />
	<span id="info"></span>
</header>
<aside id="side"></aside>
<div id="reader"></div>
<script type="module" src="./demo.ts"></script>
</body>
</html>
